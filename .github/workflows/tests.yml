name: Tester

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: socademy

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: socademy/pnpm-lock.yaml

      - name: Installer pakker
        run: pnpm install --frozen-lockfile

      - name: Kjør tester
        run: pnpm vitest run
